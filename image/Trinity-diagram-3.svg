<path class="dots" d="M368.9 263.5L320.8 346.7M598.1 263.5L646.2 346.7M435.5 540.5L531.6 540.5"/>
<rect class="box" x="408.5" y="348" width="150" height="63"/>
<text x="483.5" y="397"><tspan class="divine-name"><tspan class="divine-name-initial">G</tspan>OD</tspan></text>
<text x="480" y="44">Father</text>
<text x="188" y="563" style="text-anchor:end">Son</text>
<text x="833" y="528">Holy</text><text x="833" y="596">Spirit</text>
<text x="483.5" y="244">is</text>
<text transform="translate(308.7 475.8) rotate(-33)" y="16">is</text>
<text transform="translate(658.3 475.8) rotate(33)" y="16">is</text>
<g transform="translate(344.9 305.1) rotate(-60)"><text y="-13">is not</text><text y="44">is in</text></g>

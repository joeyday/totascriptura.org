<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 719" role="img" aria-labelledby="trinity-title">
<title id="trinity-title">The Trinity: the Father, the Son and the Holy Spirit are each God, and each is not either of the others. The Father, the Son and the Holy Spirit each glorify one another.</title>
<style>
.trinity-diagram { color: var(--color-main-text, #111); --line: #b3b3b3; --box: #ecebdc; --box-line: #b3b3b3; font-family: var(--font-secondary, "Helvetica Neue", Arial, sans-serif); font-size: 46px; font-variant-ligatures: none; }
.trinity-diagram text { fill: currentColor; text-anchor: middle; }
.trinity-diagram .line { fill: none; stroke: var(--line); stroke-width: 3; }
.trinity-diagram .dots { fill: none; stroke: var(--line); stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 0 12; }
.trinity-diagram .box { fill: var(--box); stroke: var(--box-line); stroke-width: 5; }
.trinity-diagram .divine-name { font-family: var(--font-primary, Georgia, serif); font-size: 54px; font-variant-caps: all-small-caps; }
.trinity-diagram .divine-name-initial { font-variant-caps: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .trinity-diagram { color: var(--color-main-text, #e8e8e8); --line: #77777a; --box: #3b3a30; --box-line: #77777a; } }
:root[data-theme="dark"] .trinity-diagram { --line: #77777a; --box: #3b3a30; --box-line: #77777a; }
</style>
<g class="trinity-diagram">

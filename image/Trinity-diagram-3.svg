<defs><path id="al" d="M209 540.5A317 317 0 0 1 483.5 65"/><path id="ar" d="M483.5 65A317 317 0 0 1 758 540.5"/><path id="ab" d="M209 540.5A317 317 0 0 0 758 540.5"/></defs>
<text dy="0.33em"><textPath href="#al" startOffset="50%">glorifies</textPath></text>
<text dy="0.33em"><textPath href="#ar" startOffset="50%">glorifies</textPath></text>
<text dy="0.33em"><textPath href="#ab" startOffset="50%">glorifies</textPath></text>
